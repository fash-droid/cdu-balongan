# Blueprint Render.com. Berkas ini opsional; kalau ada, Render otomatis
# memakai setelannya saat "New Web Service" dijalankan pada repo ini.
services:
  - type: web
    name: cdu-balongan
    runtime: docker
    plan: free                 # 512 MB RAM, tidur setelah 15 menit tidak aktif
    region: singapore          # jaringan paling dekat dari Indonesia
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true           # push ke main -> otomatis di-redeploy
